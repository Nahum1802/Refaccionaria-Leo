<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Refaccionaria Leo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
            --color-amarillo: #FACC15;
            --color-negro: #0a0a0a;
            --color-gris-oscuro: #1a1a1a;
            --font-barlow: 'Barlow', sans-serif;
            --font-bebas: 'Bebas Neue', sans-serif;
        }
        .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
        .reveal.visible { opacity: 1; transform: none; }
        .badge { padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .badge.entregado { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
        .badge.pendiente { background: rgba(251,146,60,0.1); color: #fb923c; border: 1px solid rgba(251,146,60,0.2); }
    </style>
</head>
<body class="font-barlow bg-negro text-[#f5f5f0] min-h-screen overflow-x-hidden flex flex-col m-0 p-0 box-border">

    <nav class="fixed top-0 left-0 right-0 z-[100] bg-negro/92 backdrop-blur-[12px] border-b border-amarillo/15 py-[14px]">
        <div class="max-w-[1200px] mx-auto px-8 flex items-center justify-between relative">
            <a href="index.html" class="flex items-center gap-[10px] no-underline">
                <div class="w-[36px] h-[36px] bg-amarillo rounded-[6px] flex items-center justify-center font-bebas text-[18px] text-black overflow-hidden"><img src="IMG/bardahl-top-logo-mobile.webp" alt="Logo"></div>
                <div class="font-bebas text-[22px] tracking-[2px] text-white">Refaccionaria <span class="text-amarillo">Leo</span></div>
            </a>
            <ul class="list-none m-0 p-0 hidden md:flex items-center gap-1">
                <li><a href="Productos.html" class="block py-[7px] px-4 rounded-[6px] text-[13px] font-semibold tracking-[1.5px] uppercase no-underline text-white/75 transition-colors duration-200 hover:text-white hover:bg-white/10">Volver a Tienda</a></li>
                <li><button onclick="cerrarSesion()" class="block py-[7px] px-4 rounded-[6px] text-[13px] font-semibold tracking-[1.5px] uppercase no-underline transition-colors duration-200 bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500/20 cursor-pointer">Cerrar sesión</button></li>
            </ul>
        </div>
    </nav>

    <div class="flex-1 max-w-[1200px] mx-auto w-full pt-[120px] pb-12 px-8">
        
        <div class="mb-10 reveal">
            <h1 class="font-bebas text-[48px] tracking-[2px] mb-2">Hola, <span class="text-amarillo" id="perfil-nombre">Cargando...</span></h1>
            <p class="text-white/50">Bienvenido a tu panel de cliente. Aquí puedes gestionar tu cuenta y ver tus compras.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 reveal" style="transition-delay: 100ms;">
                <div class="bg-gris-oscuro border border-white/5 rounded-2xl p-8 sticky top-[100px]">
                    <div class="w-20 h-20 bg-amarillo/10 border border-amarillo/30 rounded-full flex items-center justify-center text-[32px] mb-6">👤</div>
                    <h3 class="font-bebas text-[24px] tracking-[1.5px] border-b border-white/10 pb-4 mb-4">Información de <span class="text-amarillo">Contacto</span></h3>
                    
                    <div class="mb-4">
                        <div class="text-[11px] font-bold tracking-[1.5px] uppercase text-white/40 mb-1">Nombre completo</div>
                        <div class="text-[16px] text-white" id="info-nombre">...</div>
                    </div>
                    <div class="mb-4">
                        <div class="text-[11px] font-bold tracking-[1.5px] uppercase text-white/40 mb-1">Correo Electrónico</div>
                        <div class="text-[16px] text-white" id="info-correo">...</div>
                    </div>
                    
                    <button class="w-full mt-4 border border-white/10 bg-white/5 text-white/70 font-barlow font-bold text-[13px] tracking-[1.5px] uppercase py-3 rounded-[10px] transition-all hover:bg-white/10 cursor-pointer">
                        Editar Información
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2 reveal" style="transition-delay: 200ms;">
                <div class="bg-gris-oscuro border border-white/5 rounded-2xl p-8">
                    <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-6">
                        <h3 class="font-bebas text-[28px] tracking-[2px]">Mis <span class="text-white">Pedidos</span></h3>
                        <div class="text-[20px]">📦</div>
                    </div>

                    <div id="contenedor-pedidos" class="flex flex-col gap-4">
                        <div class="text-center py-10 animate-pulse text-white/40">Buscando tus pedidos en la base de datos...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="config.js"></script>
    <script>
        let usuarioSesion = null;

        document.addEventListener("DOMContentLoaded", () => {
        
            const sesionData = localStorage.getItem("usuario");
            if (!sesionData) {
                window.location.href = "Login.html";
                return;
            }

            usuarioSesion = JSON.parse(sesionData);
            
            document.getElementById("perfil-nombre").textContent = usuarioSesion.nombre;
            document.getElementById("info-nombre").textContent = `${usuarioSesion.nombre} ${usuarioSesion.apellidos}`;
            document.getElementById("info-correo").textContent = usuarioSesion.email;

            cargarMisPedidos();
            setTimeout(() => document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible')), 100);
        });

        async function cargarMisPedidos() {
            const contenedor = document.getElementById("contenedor-pedidos");
            try {
                const response = await fetch(`${API_BASE}/cliente/mis_pedidos.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_usuario: usuarioSesion.id_usuario })
                });
                
                const data = await response.json();
                contenedor.innerHTML = "";

                if (data.status === 'success') {
                    if (data.pedidos.length === 0) {
                        contenedor.innerHTML = `
                            <div class="text-center py-12 border border-dashed border-white/10 rounded-xl bg-white/5">
                                <div class="text-[40px] mb-3">🛒</div>
                                <div class="text-white/60 mb-4">Aún no has realizado ninguna compra.</div>
                                <a href="Productos.html" class="inline-block bg-amarillo text-black font-bold uppercase tracking-[1px] text-[12px] py-2.5 px-6 rounded-lg transition-transform hover:-translate-y-0.5 no-underline">Explorar Catálogo</a>
                            </div>`;
                        return;
                    }

                    data.pedidos.forEach(ped => {
                        const fmtTotal = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(ped.total);
                        const fecha = new Date(ped.fecha_pedido).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
                        const claseBadge = ped.estado === 'Completado' ? 'entregado' : 'pendiente';

                        contenedor.innerHTML += `
                            <div class="border border-white/10 bg-negro/50 rounded-xl p-5 transition-colors hover:border-amarillo/30">
                                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-4">
                                    <div>
                                        <div class="text-[12px] text-white/50 font-bold tracking-[1px] uppercase mb-1">Pedido #${ped.id_pedido}</div>
                                        <div class="text-[14px] text-white/80">${fecha}</div>
                                    </div>
                                    <div class="text-right">
                                        <span class="badge ${claseBadge}">${ped.estado}</span>
                                    </div>
                                </div>
                                <div class="flex justify-between items-end border-t border-white/5 pt-4">
                                    <div class="text-[13px] text-white/40 font-semibold tracking-[1px] uppercase">Total Pagado</div>
                                    <div class="font-bebas text-[24px] text-amarillo tracking-[1px]">${fmtTotal}</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                contenedor.innerHTML = `<div class="text-red-400 p-4 border border-red-500/30 rounded-lg bg-red-500/10">Error al cargar el historial. Intenta nuevamente.</div>`;
            }
        }

        function cerrarSesion() {
            localStorage.removeItem("usuario");
            window.location.href = "Login.html";
        }
    </script>
</body>
</html>
