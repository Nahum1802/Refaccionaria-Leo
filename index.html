
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Refaccionaria Leo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
            --color-amarillo: #FACC15;
            --color-negro: #0a0a0a;
            --color-gris-oscuro: #1a1a1a;
            --color-gris-medio: #242424;
            --font-barlow: 'Barlow', sans-serif;
            --font-bebas: 'Bebas Neue', sans-serif;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-barlow bg-negro text-[#f5f5f0] min-h-screen overflow-x-hidden flex flex-col m-0 p-0 box-border">

    <nav class="fixed top-0 left-0 right-0 z-[100] bg-negro/92 backdrop-blur-[12px] border-b border-amarillo/15 py-[14px]">
        <div class="max-w-[1200px] mx-auto px-8 flex items-center justify-between relative">
            <a href="index.html" class="flex items-center gap-[10px] no-underline">
                <div class="w-[36px] h-[36px] bg-amarillo rounded-[6px] flex items-center justify-center font-bebas text-[18px] text-black">
                    <img src="IMG/bardahl-top-logo-mobile.webp" alt="Logo Refaccionaria Leo">
                </div>
                <div class="font-bebas text-[22px] tracking-[2px] text-white">Refaccionaria <span class="text-amarillo">Leo</span></div>
            </a>

            <ul class="list-none m-0 p-0 hidden md:flex items-center gap-1">
                <li><a href="index.html" class="block py-[7px] px-4 rounded-[6px] text-[13px] font-semibold tracking-[1.5px] uppercase no-underline text-white/75 transition-colors duration-200 hover:text-white hover:bg-white/10">Inicio</a></li>
                <li><a href="Productos.html" class="block py-[7px] px-4 rounded-[6px] text-[13px] font-semibold tracking-[1.5px] uppercase no-underline text-white/75 transition-colors duration-200 hover:text-white hover:bg-white/10">Productos</a></li>
                <li><a href="Contacto.html" class="block py-[7px] px-4 rounded-[6px] text-[13px] font-semibold tracking-[1.5px] uppercase no-underline text-white/75 transition-colors duration-200 hover:text-white hover:bg-white/10">Contacto</a></li>
                <li><a href="Login.html" class="block py-[7px] px-4 rounded-[6px] text-[13px] font-semibold tracking-[1.5px] uppercase no-underline transition-colors duration-200 bg-amarillo text-black hover:bg-yellow-500">Iniciar sesión</a></li>
            </ul>

            <button id="menu-btn" class="md:hidden flex items-center justify-center p-2 text-white/80 hover:text-amarillo transition-colors focus:outline-none cursor-pointer">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>

        <div id="mobile-menu" class="hidden absolute top-[100%] left-0 right-0 bg-negro/95 backdrop-blur-[12px] border-b border-amarillo/15 md:hidden shadow-2xl">
            <ul class="list-none m-0 p-6 flex flex-col gap-3">
                <li><a href="index.html" class="block py-3 px-4 rounded-lg text-[14px] font-semibold tracking-[1.5px] uppercase text-center text-white/80 hover:bg-white/10 hover:text-white transition-colors">Inicio</a></li>
                <li><a href="Productos.html" class="block py-3 px-4 rounded-lg text-[14px] font-semibold tracking-[1.5px] uppercase text-center text-white/80 hover:bg-white/10 hover:text-white transition-colors">Productos</a></li>
                <li><a href="Contacto.html" class="block py-3 px-4 rounded-lg text-[14px] font-semibold tracking-[1.5px] uppercase text-center text-white/80 hover:bg-white/10 hover:text-white transition-colors">Contacto</a></li>
                <li><a href="Login.html" class="block py-3 px-4 rounded-lg text-[14px] font-semibold tracking-[1.5px] uppercase text-center bg-amarillo text-black">Iniciar sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="flex-1 flex items-center justify-center min-h-screen pt-[80px] pb-12 px-4 bg-[#0a0a0a] relative overflow-hidden">

        <div class="absolute inset-0 bg-[linear-gradient(160deg,#111_0%,#0a0a0a_60%)]"></div>
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-[radial-gradient(circle,rgba(250,204,21,0.1)_0%,transparent_65%)] rounded-full pointer-events-none"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-[radial-gradient(circle,rgba(250,204,21,0.06)_0%,transparent_65%)] rounded-full pointer-events-none"></div>
        <div class="absolute inset-0 bg-[linear-gradient(rgba(250,204,21,0.04)_1px,transparent_1px),linear-gradient(90deg,rgba(250,204,21,0.04)_1px,transparent_1px)] bg-[size:55px_55px] pointer-events-none"></div>

        <div class="w-full max-w-[420px] relative z-10 bg-[#0f0f0f]/95 backdrop-blur-sm border border-white/5 p-8 sm:p-10 rounded-2xl shadow-2xl">
            <div class="text-center mb-10">
                <img src="IMG/bardahl-top-logo-mobile.webp" alt="Logotipo Refaccionaria Leo" class="w-[48px] h-[48px] mx-auto mb-4">
                <h1 class="font-bebas text-[36px] tracking-[2px] mb-1.5">Bienvenido de vuelta</h1>
                <p class="text-[14px] text-white/40">Ingresa tus datos para continuar</p>
            </div>

            <div class="mb-4">
                <label for="email" class="block text-[12px] font-bold tracking-[1.5px] uppercase text-white/40 mb-2">Correo electrónico</label>
                <input type="email" id="email" class="w-full bg-white/5 border border-white/10 rounded-[10px] py-[13px] px-4 text-[15px] text-white font-barlow outline-none transition-all duration-200 focus:border-amarillo/50 focus:bg-amarillo/5 placeholder:text-white/20" placeholder="tu@correo.com">
            </div>

            <div class="mb-4">
                <label for="password" class="block text-[12px] font-bold tracking-[1.5px] uppercase text-white/40 mb-2">Contraseña</label>
                <input type="password" id="password" class="w-full bg-white/5 border border-white/10 rounded-[10px] py-[13px] px-4 text-[15px] text-white font-barlow outline-none transition-all duration-200 focus:border-amarillo/50 focus:bg-amarillo/5 placeholder:text-white/20" placeholder="Tu contraseña">
            </div>

            <button class="w-full bg-amarillo text-black font-barlow font-bold text-[15px] tracking-[2px] uppercase py-[15px] px-6 rounded-[10px] border-none cursor-pointer transition-all duration-200 shadow-[0_4px_20px_rgba(250,204,21,0.25)] hover:bg-[#fde047] hover:-translate-y-0.5" id="btn-login" onclick="iniciarSesion()">
                <span id="btn-texto">Iniciar sesión</span>
            </button>

            <div class="text-center mt-6 text-[14px] text-white/35">
                ¿Aún no tienes cuenta? <a href="Register.html" class="text-amarillo font-bold no-underline hover:opacity-80">Regístrate gratis</a>
            </div>
        </div>
    </div>

    <div class="bg-negro border-t border-white/5 py-5 px-8 text-center text-[12px] text-white/20">
        <span>© 2025 Refaccionaria Leo — Chimalhuacán, Estado de México</span>
    </div>

    <script>
        function iniciarSesion() {
            const email = document.getElementById('email').value.trim();
            const pass  = document.getElementById('password').value;
            const btn   = document.getElementById('btn-login');

            if (!email || !pass) {
                mostrarToast('Completa todos los campos.', false);
                return;
            }

            btn.classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('btn-texto').textContent = 'Validando...';

            fetch(`${API_BASE}/auth/login.php`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: pass })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success' && data.usuario) {
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    document.getElementById('btn-texto').textContent = '¡Redirigiendo!';
                    setTimeout(() => {
                        window.location.href = (data.usuario.id_rol == 2) ? "admin.html" : "Perfil.html";
                    }, 1500);
                } else {
                    mostrarToast(data.error || 'Credenciales incorrectas', false);
                    restablecerBoton(btn);
                }
            })
            .catch(() => {
                mostrarToast('Error de conexión con el servidor.', false);
                restablecerBoton(btn);
            });
        }

        function restablecerBoton(btn) {
            btn.classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('btn-texto').textContent = 'Iniciar sesión';
        }

        function mostrarToast(mensaje, esExito = true) {
            const contenedor = document.getElementById('toast-container') || (() => {
                const div = document.createElement('div');
                div.id = 'toast-container';
                div.style.cssText = 'position:fixed;bottom:2rem;right:2rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem';
                document.body.appendChild(div);
                return div;
            })();
            const toast = document.createElement('div');
            toast.style.cssText = `background:#1a1a1a;border:1px solid ${esExito ? 'rgba(74,222,128,0.35)' : 'rgba(248,113,113,0.35)'};border-radius:14px;padding:1rem 1.5rem;color:white;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,0.5);transform:translateY(100px);opacity:0;transition:transform 0.4s ease,opacity 0.4s ease;max-width:340px`;
            toast.textContent = mensaje;
            contenedor.appendChild(toast);
            requestAnimationFrame(() => {
                toast.style.transform = 'translateY(0)';
                toast.style.opacity = '1';
            });
            setTimeout(() => {
                toast.style.transform = 'translateY(100px)';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') iniciarSesion();
        });

        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuBtn) {
            menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
        }
    </script>
</body>
</html>
